spring:
  application:
    name: smartlink

  datasource:
    url: ${SMARTLINK_DB_URL:jdbc:postgresql://localhost:5432/smartlink}
    username: ${SMARTLINK_DB_USER:smartlink}
    password: ${SMARTLINK_DB_PASSWORD:}
    hikari:
      # AC-6.4: a saturated or unreachable pool must surface as a fast, clear failure.
      # Waiting 30s (the default) to discover the database is gone turns one dependency
      # outage into thread-pool exhaustion across the whole service.
      connection-timeout: 2000
      validation-timeout: 1000
      maximum-pool-size: 20
      minimum-idle: 5
      # R-3. connection-timeout above bounds *acquiring* a connection and says nothing about
      # how long a query may then run on one. Those are different failures and only the first
      # was bounded: with a database that answered slowly rather than not at all, a 10 s query
      # produced a >20 s request - 10 s per attempt, twice, because the retry ran too. Twelve
      # concurrent requests took 131 s. Measured, not assumed; see validation.md §3.
      #
      # statement_timeout is a server-side cap PostgreSQL applies to every statement on the
      # connection, so it covers JPA, JdbcTemplate and the health probe alike rather than only
      # the paths someone remembered to annotate.
      #
      # 2 s is chosen against the 3 s budget in spec §3.2, leaving room for one attempt plus
      # overhead. CAVEAT, and it is a real one: Flyway migrates through this same pool, so a
      # future migration taking longer than 2 s will be cancelled. V1 and V2 are metadata-only
      # and finish in milliseconds. A migration that needs longer must raise this deliberately
      # for the migration step rather than discovering the cap during a deploy.
      connection-init-sql: SET statement_timeout = 2000

  jpa:
    # Flyway owns the schema. Hibernate is only permitted to check that it agrees.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  lifecycle:
    # R-4. `server.shutdown: graceful` alone stops accepting new connections but leaves the wait
    # for in-flight requests unbounded, which turns one wedged request into a deploy that never
    # finishes. This bounds it.
    #
    # The number is only half a decision: the platform's termination grace period must be LONGER
    # than this, or the platform SIGKILLs the process mid-request and the graceful shutdown was
    # decorative. Stated in the runbook because it is a property of the pair, not of this file.
    timeout-per-shutdown-phase: ${SMARTLINK_SHUTDOWN_GRACE:30s}

server:
  port: ${SMARTLINK_PORT:8080}
  error:
    # Never leak stack traces or internal messages to a caller.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful

smartlink:
  # Base URL used to build the short link returned at creation time.
  base-url: ${SMARTLINK_BASE_URL:http://localhost:8080}
  # Link creation is anonymous in the prototype (GF-03), so there is deliberately no
  # credential configured here. Production requires authentication, authorization,
  # quotas and rate limiting - see engineering-spec.md §8.2.
  destination:
    max-length: 2048

  resilience:
    # One retry, and no more. The redirect path carries the entire load, so during an outage
    # three retries per request means three times the load against a dependency that is already
    # failing, three times the thread-holding, and a caller who waits three times as long to be
    # told to come back. The cap is a load-shedding decision as much as a resilience one.
    max-retries: ${SMARTLINK_MAX_RETRIES:1}
    # Full-jitter ceiling for the first backoff. Without jitter every in-flight request retries
    # at the same instant and the retry becomes its own thundering herd.
    base-backoff-ms: ${SMARTLINK_RETRY_BACKOFF_MS:50}

management:
  endpoints:
    web:
      exposure:
        # Deliberately narrow. Actuator's full surface is not something to expose by default.
        #
        # `metrics` is added for R-5. An SLI that can only be described is not an SLI, and every
        # signal in spec section 4.1 is derived from `http.server.requests` plus the counter
        # registered in ResolveLinkUseCase.
        #
        # PRODUCTION CAVEAT, and it is not optional: this endpoint is unauthenticated here because
        # the whole prototype is (GF-03). Request metrics disclose traffic shape and error rates,
        # so a real deployment binds the management port separately and authenticates it. Adding
        # the endpoint without stating that would be shipping an information leak with a
        # reliability label on it.
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # `db` must be added explicitly. Spring's default readiness group contains only
        # readinessState, so out of the box this endpoint reports UP with the database
        # unreachable - and a load balancer would happily keep routing to an instance that
        # cannot serve a single request. Caught by DependencyOutageIT; a readiness test
        # written against a healthy database passes either way.
        readiness:
          include: readinessState,db
        # Liveness deliberately does NOT include db. If it did, a transient database outage
        # would make every instance report itself dead at once, the orchestrator would restart
        # all of them, and the restarts would add load to the database that was already
        # struggling - converting a recoverable dependency failure into a self-inflicted one.
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.smartlink: INFO
    # Pinned, and not merely left to inherit from root.
    #
    # Spring MVC logs the deserialised request body at DEBUG, which for this service means the
    # destination URL - and destination query strings routinely carry reset tokens and signed
    # URLs (NFR-14). Without this pin, the entirely reasonable act of setting root to DEBUG to
    # troubleshoot something unrelated would silently start copying customer secrets into every
    # log sink, with nothing in the change to suggest it.
    #
    # The application's own code never logs a destination at any level; that is asserted by
    # LogHygieneIT. This closes the framework's half of the same exposure.
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
